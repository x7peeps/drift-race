function makeRemoteCar(colorHex, name) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: .4, metalness: .35 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, .55, 4.4), bodyMat);
  body.position.y = .55; body.castShadow = true; g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, .5, 2.0),
    new THREE.MeshStandardMaterial({ color: 0x1a1d24, roughness: .2, metalness: .6 }));
  cabin.position.set(0, 1.05, -.2); cabin.castShadow = true; g.add(cabin);
  const wheelGeo = new THREE.CylinderGeometry(.42, .42, .34, 12);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x14161c });
  [[-.85,1.45],[.85,1.45],[-.85,-1.45],[.85,-1.45]].forEach(([x,z]) => {
    const w = new THREE.Mesh(wheelGeo, wheelMat); w.rotation.z = Math.PI/2;
    w.position.set(x, .42, z); g.add(w);
  });
  // 头顶名牌
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const cx = cv.getContext('2d');
  cx.fillStyle = 'rgba(10,14,20,.65)'; cx.beginPath(); cx.roundRect(8,8,240,48,10); cx.fill();
  cx.fillStyle = '#fff'; cx.font = '700 28px -apple-system'; cx.textAlign = 'center';
  cx.fillText(name.slice(0,8), 128, 42);
  const tex = new THREE.CanvasTexture(cv);
  const tag = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  tag.scale.set(2.6, .65, 1); tag.position.y = 2.1; g.add(tag);
  return g;
}

async function joinRoom(code, isCreate) {
  if (myRoom) { document.getElementById('roomStatus').textContent = `已在房间 ${myRoom}, 刷新页面可换房`; return; }
  const name = myName || '无名车手';
  try {
    if (isCreate) {
      const { error } = await sb.from('rooms').upsert({ id: code, host_name: name, max_players: 5 });
      if (error) throw error;
    } else {
      const { data, error } = await sb.from('rooms').select('id').eq('id', code);
      if (error) throw error;
      if (!data.length) { document.getElementById('roomStatus').textContent = '房间不存在, 检查房号或直接创建'; return; }
    }
    const { data, error } = await sb.from('room_players')
      .insert({ room_id: code, player_name: name, car_state: { x:0, z:0, heading:0, speed:0 } })
      .select('id');
    if (error) throw error;
    myRoom = code; myPlayerRowId = data[0].id;
    document.getElementById('roomStatus').textContent = `房间 ${code} 已就位 — 把房号发给朋友, 最多5人`;
    // 生成自己的颜色
    let h = 0; for (const c of code + name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    myColor = new THREE.Color().setHSL((h % 360) / 360, .75, .55).getHex();
    if (window.__bodyMat) window.__bodyMat.color.setHex(myColor); else if (car.bodyMat) car.bodyMat.color.setHex(myColor);
    // 订阅房间玩家变化
    sb.channel(`room-${code}-${Date.now()}`)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'room_players', filter: `room_id=eq.${code}` },
        payload => {
          const row = payload.new;
          if (!row || row.id === myPlayerRowId) return;
          if (payload.eventType === 'DELETE') { removeRemoteCar(row.id); return; }
          upsertRemoteCar(row.id, row.player_name, row.car_state);
        })
      .subscribe();
    // 10Hz心跳 + 3s清理自己旧记录(重连幂等)
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(pushCarState, 100);
    setInterval(async () => {  // 60s保活: 让UPDATE持续发生也更新last_seen
      if (myRoom) await sb.from('room_players').update({ last_seen: new Date().toISOString() }).eq('id', myPlayerRowId);
    }, 30000);
  } catch(e) {
    document.getElementById('roomStatus').textContent = '加入失败: ' + e.message;
  }
}

function upsertRemoteCar(id, name, st) {
  if (!remoteCars[id]) {
    let h = 0; for (const c of (myRoom||'') + name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const color = new THREE.Color().setHSL((h % 360) / 360, .75, .55).getHex();
    const mesh = makeRemoteCar(color, name);
    mesh.position.set(st.x ?? 0, 0, st.z ?? 0);
    scene.add(mesh);
    remoteCars[id] = { mesh, target: { ...st }, name };
  } else {
    remoteCars[id].target = { ...st };
  }
  remoteCars[id].buff = { boost: st.boost || 0, shield: st.shield || 0 };
}

// 远程车buff视觉: 蓝色护盾罩 + 橙色加速尾焰
function tickRemoteBuff(dt) {
  const t = nowSec();
  for (const id in remoteCars) {
    const rc = remoteCars[id], b = rc.buff || {};
    // 护盾罩
    const hasShield = b.shield > 0;
    if (hasShield && !rc.shieldMesh) {
      rc.shieldMesh = new THREE.Mesh(new THREE.SphereGeometry(2.4, 14, 10),
        new THREE.MeshBasicMaterial({ color: 0x3fa8ff, transparent: true, opacity: .2 }));
      rc.mesh.add(rc.shieldMesh);
      rc.shieldMesh.position.y = 0.9;
    }
    if (rc.shieldMesh) rc.shieldMesh.visible = hasShield;
    // 加速尾焰: 车后方橙色光点(简单sprite)
    const hasBoost = b.boost > 0;
    if (hasBoost && !rc.boostMesh) {
      rc.boostMesh = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1.6, 8),
        new THREE.MeshBasicMaterial({ color: 0xff8822, transparent: true, opacity: .75 }));
      rc.boostMesh.rotation.x = -Math.PI/2;
      rc.mesh.add(rc.boostMesh);
      rc.boostMesh.position.set(0, 0.55, -2.6);
    }
    if (rc.boostMesh) {
      rc.boostMesh.visible = hasBoost;
      if (hasBoost) rc.boostMesh.scale.y = 0.8 + Math.sin(t*30) * 0.35;  // 抖动火焰
    }
  }
}
function removeRemoteCar(id) {
  if (remoteCars[id]) { scene.remove(remoteCars[id].mesh); delete remoteCars[id]; }

function pushCarState() {
  if (!myRoom) return;
  const tNow = nowSec();
  sb.from('room_players').update({
    car_state: { x: +state.pos.x.toFixed(1), z: +state.pos.z.toFixed(1),

                 boost: Math.max(0, +(boostUntil - tNow).toFixed(1)), shield: Math.max(0, +(shieldUntil - tNow).toFixed(1)) },
    last_seen: new Date().toISOString()
  }).eq('id', myPlayerRowId).then();
}


/* ---- M2.4: 圈速 ---- */
const lap = { count: 0, startedAt: 0, lastLap: 0, best: Number(localStorage.getItem('drift_best')||0), armed: false };
function updateLap() {
  if (!playing) { lap.armed = false; return; }
  const z = state.pos.z, x = state.pos.x;
  const t = nowSec();
  // 必须先跑到线前方(z>110)解锁, 且两圈最少隔15s(防瞬移/来回蹭线刷圈)
  if (z > 110) lap.armed = true;
  if (Math.abs(x) < 14 && lap.armed && z <= 88 && z > 80 && state.speedMps > 8 && t - lap.startedAt > 15) {
    if (lap.startedAt) {
      lap.lastLap = t - lap.startedAt;
      if (!lap.best || lap.lastLap < lap.best) {
        lap.best = lap.lastLap;
        localStorage.setItem('drift_best', String(lap.best));
      }
    }
    lap.startedAt = t; lap.count++; lap.armed = false;
  }
}

// ---- 车对车碰撞 (圆形近似, 半径1.7m) ----
function resolveCollisions() {
  if (!playing) return;
  for (const id in remoteCars) {
    const rc = remoteCars[id];
    const dx = rc.mesh.position.x - state.pos.x;
    const dz = rc.mesh.position.z - state.pos.z;
    const dist = Math.hypot(dx, dz);
    const MIN = 3.2;  // 两车半径和
    if (dist > 0.001 && dist < MIN) {
      const push = (MIN - dist) / 2;
      const nx = dx / dist, nz = dz / dist;
      // 各退一半
      state.pos.x -= nx * push; state.pos.z -= nz * push;
      rc.mesh.position.x += nx * push; rc.mesh.position.z += nz * push;
      // 对方目标位置也同步推(下个心跳它自己会修正)
      rc.target.x += nx * push; rc.target.z += nz * push;
      // 速度衰减30% + 轻微弹开 (护盾期间免伤)
      if (nowSec() >= shieldUntil) {
        state.speedMps *= 0.7;
        state.lateralSpeed -= nx * 2.5;
      }
      // 碰撞火花: 复用烟雾粒子池变白
      for (let i = 0; i < 6; i++) {
        const sp = state.pos.clone().add(new THREE.Vector3(nx*1.4, 0.4, nz*1.4));
        emitSmoke(sp, 0.9);
      }
      if (nowSec() - lastCollSfx > 0.4) { sfxCrash(); lastCollSfx = nowSec(); }
    }
  }
}

function tickRemoteCars(dt) {
  const k = 1 - Math.pow(0.001, dt);  // 平滑插值
  for (const id in remoteCars) {
    const rc = remoteCars[id], t = rc.target;
    rc.mesh.position.x += (t.x - rc.mesh.position.x) * k;
    rc.mesh.position.z += (t.z - rc.mesh.position.z) * k;
    if (t.heading != null) rc.mesh.rotation.y += (t.heading - rc.mesh.rotation.y) * k;
  }
}

/* ============================================================
   暴力漂移赛车 M1 — 单机漂移Demo
   物理参数移植自 nordschleife-racer (12.7k★ 参考实现)
   driftTarget = speedNorm × steerNorm × inputNorm(手刹∩油门) × capability
   ============================================================ */

// ---- 物理常量 (nordschleife-racer 实测值) ----
const ENTRY_SPEED = 7.5;        // 起漂速度 m/s
const FULL_SPEED  = 23;         // 满漂移速度
const RELEASE_SPEED = 4.5;      // 低于此速快速退出漂移
const MAX_STEER_DEG = 34;
const STEER_SENS = 0.132 * 12;  // steerLerp系数
const TOP_SPEED_KPH = 300;
const ZERO_TO_100 = 3.55;
const BRAKE_DECEL = 42;
const AERO_DRAG = 0.00014;
const ROLL_RESIST = 0.34;
const DRIFT_CAPABILITY = 1.0;   // M1单车上限100%

// ---- 场景 ----
const renderer = new THREE.WebGLRenderer({ antialias:true });

  const wheels = [];
  for (const [wx, wz, front] of [[-0.92, 1.42, true],[0.92, 1.42, true],[-0.92, -1.42, false],[0.92, -1.42, false]]) {

const smokeTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const cx = cv.getContext('2d');
  const gr = cx.createRadialGradient(32,32,2, 32,32,28);

  cx.fillStyle = gr; cx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
})();
const smokePool = [];
const SMOKE_MAX = 96;
function emitSmoke(pos, intensity) {
  if (smokePool.length >= SMOKE_MAX) {
    const old = smokePool.shift();
    scene.remove(old.sprite); old.sprite.material.dispose();
  }
  const m = new THREE.SpriteMaterial({
    map:smokeTex, transparent:true,
    opacity:THREE.MathUtils.lerp(0.2, 0.55, intensity),
    depthWrite:false, color:0xbec3c8
  });
  const s = new THREE.Sprite(m);
  const sc = THREE.MathUtils.lerp(0.6, 1.4, intensity);
  s.scale.setScalar(sc);
  s.position.copy(pos);
  scene.add(s);
  smokePool.push({ sprite:s, age:0, life:0.8+Math.random()*0.7,
                   vel:new THREE.Vector3((Math.random()-0.5)*1.4, 1.1+Math.random()*1.2, (Math.random()-0.5)*1.4),
                   grow:2.2+Math.random()*1.6 });
}
function updateSmoke(dt) {
  for (let i=smokePool.length-1; i>=0; i--) {
    const p = smokePool[i];
    p.age += dt;
    if (p.age >= p.life) { scene.remove(p.sprite); p.sprite.material.dispose(); smokePool.splice(i,1); continue; }
    p.sprite.position.addScaledVector(p.vel, dt);
    p.sprite.scale.addScalar(p.grow*dt);
    p.sprite.material.opacity = (1 - p.age/p.life) * 0.55;
  }
}

/* ---- M3-D: WebAudio 程序化音效 ---- */
let AC = null, engineOsc = null, engineGain = null, engineFilter = null, skidGain = null, skidSrc = null;
function initAudio() {
  if (AC) { AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  engineOsc = AC.createOscillator(); engineOsc.type = 'sawtooth'; engineOsc.frequency.value = 55;
  engineFilter = AC.createBiquadFilter(); engineFilter.type = 'lowpass'; engineFilter.frequency.value = 400;
  engineGain = AC.createGain(); engineGain.gain.value = 0.0;
  engineOsc.connect(engineFilter); engineFilter.connect(engineGain); engineGain.connect(AC.destination);
  engineOsc.start();
  const len = AC.sampleRate * 1;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  skidSrc = AC.createBufferSource(); skidSrc.buffer = buf; skidSrc.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 1.2;
  skidGain = AC.createGain(); skidGain.gain.value = 0;
  skidSrc.connect(bp); bp.connect(skidGain); skidGain.connect(AC.destination);
  skidSrc.start();
}
function sfxEngine(speedKmh, dt) {
  if (!engineGain) return;
  const t = AC.currentTime;
  const norm = Math.min(1, speedKmh / 180);
  engineOsc.frequency.setTargetAtTime(50 + norm * 160, t, 0.08);
  engineFilter.frequency.setTargetAtTime(300 + norm * 2200, t, 0.08);
  engineGain.gain.setTargetAtTime(0.05 + norm * 0.09, t, 0.1);
}
function sfxSkid(amount) {
  if (!skidGain) return;
  skidGain.gain.setTargetAtTime(Math.min(0.16, amount * 0.28), AC.currentTime, 0.06);
}
function sfxBlip(freqs, dur=0.09, vol=0.22, type='square') {
  if (!AC) return;
  freqs.forEach((f, i) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    const t0 = AC.currentTime + i * dur;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  });
}
function sfxCrash() {
  if (!AC) return;
  const len = AC.sampleRate * 0.25;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
  const s = AC.createBufferSource(); s.buffer = buf;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
  const g = AC.createGain(); g.gain.value = 0.5;
  s.connect(lp); lp.connect(g); g.connect(AC.destination); s.start();
}

// ---- 车辆状态 ----
const state = {
  pos: new THREE.Vector3(0, 0, 90),      // 起始在环形赛道上
  heading: Math.PI,                       // 朝切线方向
  speedMps: 0,
  lateralSpeed: 0,
  steerAngle: 0,
  driftAmount: 0,
  driftScore: 0,
  combo: 1,
  comboTimer: 0,
  smokeTimer: 0,
};
const WHEELBASE = 2.84;  // 车参考 4.4*0.62≈2.7, 取2.84

function resetCar() {
  state.pos.set(0, 0, 90); state.heading = Math.PI;
  state.speedMps = 0; state.lateralSpeed = 0; state.driftAmount = 0;
  state.combo = 1; state.comboTimer = 0;
}

// ---- 主循环 ----
const clock = new THREE.Clock();
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _tmp = new THREE.Vector3();
let hudTimer = 0;

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  // --- 输入归一 ---
  const throttle = keyState('KeyW') ? 1 : 0;
  const braking  = keyState('KeyS') ? 1 : 0;
  const steer    = (keyState('KeyA') ? 1 : 0) - (keyState('KeyD') ? 1 : 0); // A=左=+
  const handbrake = keyState('Space') ? 1 : 0;

  // --- 转向 (低速助力, 参考实现) ---
  const speedAbs = Math.abs(state.speedMps);
  const steerScale = 0.132;
  const lowBoost = THREE.MathUtils.lerp(2.05, 1, THREE.MathUtils.clamp(speedAbs/24, 0, 1));
  const targetSteer = steer * MAX_STEER_DEG * Math.PI/180 * steerScale * lowBoost * 10;
  const steerLerp = THREE.MathUtils.clamp(dt * STEER_SENS * 1.9, 0, 1);
  state.steerAngle = THREE.MathUtils.lerp(state.steerAngle, targetSteer, steerLerp);

  // --- 纵向动力 ---
  if (speedAbs < 0.2) {
    state.lateralSpeed = THREE.MathUtils.lerp(state.lateralSpeed, 0, steerLerp);
    state.driftAmount = Math.max(0, state.driftAmount - dt*4);
  } else {
    // 漂移量: speed × steer × (手刹∩油门) × capability
    const driftSpeedNorm = THREE.MathUtils.clamp((speedAbs - ENTRY_SPEED) / (FULL_SPEED - ENTRY_SPEED), 0, 1);
    const driftSteerNorm = THREE.MathUtils.clamp((Math.abs(steer) - 0.12) / 0.88, 0, 1);
    const hbNorm = THREE.MathUtils.clamp((handbrake - 0.18) / 0.82, 0, 1);
    const thNorm = THREE.MathUtils.clamp((throttle - 0.15) / 0.85, 0, 1);
    const inputNorm = Math.min(hbNorm, thNorm);
    // M1简化: 无手刹时大转向+油门也可滑(娱乐化"暴力漂移"), 手刹放大
    const driftTarget = driftSpeedNorm * driftSteerNorm
      * (inputNorm > 0 ? 1 : 0.45 * thNorm) * DRIFT_CAPABILITY * (handbrake>0 ? 1.15 : 1);
    const buildRate = THREE.MathUtils.lerp(1.4, 3.1, driftTarget) * 1;
    const releaseRate = speedAbs > RELEASE_SPEED ? THREE.MathUtils.lerp(2.4,4.2,1-driftTarget) : THREE.MathUtils.lerp(4.2,6,1-driftTarget);
    const rate = driftTarget >= state.driftAmount ? buildRate : releaseRate;
    state.driftAmount = THREE.MathUtils.lerp(state.driftAmount, driftTarget, THREE.MathUtils.clamp(dt*rate, 0, 1));

    // 侧滑 + 横摆
    const driftPower = 1.0;
    const slipTarget = -steer * speedAbs * (0.3 + state.driftAmount*1.05) * driftPower;
    const slipLerp = THREE.MathUtils.clamp(dt * (2.2 + state.driftAmount*2.4), 0, 1);
    // M1无碰撞约束, 侧滑封顶±22m/s防飞出
    state.lateralSpeed = THREE.MathUtils.clamp(
      THREE.MathUtils.lerp(state.lateralSpeed, slipTarget, slipLerp), -22, 22);
  }

  // 加速/刹车/阻力
  let accel = 0;
  if (throttle) {
    const powerCurve = 1 - THREE.MathUtils.clamp(speedAbs/(TOP_SPEED_KPH/3.6), 0, 1) * 0.75;
    accel += (100/ZERO_TO_100/3.6) * 2.4 * powerCurve * (nowSec() < boostUntil ? 1.4 : 1);
  }
  if (braking) accel -= state.speedMps > 0.5 ? BRAKE_DECEL*0.55 : (accel = -8, -8);
  if (handbrake) accel -= Math.sign(state.speedMps) * 10 * (state.driftAmount>0.3 ? 0.3 : 1);
  accel -= state.speedMps * ROLL_RESIST * 0.55 * dt * 10 / Math.max(speedAbs,1) * Math.min(speedAbs,1);
  accel -= AERO_DRAG * state.speedMps * speedAbs * 100;
  if (!throttle && !braking && Math.abs(state.speedMps) < 0.3) state.speedMps = 0;
  state.speedMps = THREE.MathUtils.clamp(state.speedMps + accel*dt, -9.5, TOP_SPEED_KPH/3.6);

  // --- 运动积分 ---
  const yawRate = (state.speedMps / WHEELBASE) * Math.tan(state.steerAngle)
                + (state.driftAmount > 0.001 ? steer * (0.35 + state.driftAmount*1.15) * driftPower * Math.min(speedAbs/10,1) : 0);
  state.heading += yawRate * dt;

  _fwd.set(Math.sin(state.heading), 0, Math.cos(state.heading));
  _right.set(_fwd.z, 0, -_fwd.x); // 右手侧
  _tmp.copy(_fwd).multiplyScalar(state.speedMps * dt)
      .addScaledVector(_right, state.lateralSpeed * dt);
  state.pos.add(_tmp);

  // 边界约束 (场地700x700, 留50余量弹回)
  const LIM = 320;
  if (Math.abs(state.pos.x) > LIM || Math.abs(state.pos.z) > LIM) {
    state.pos.x = THREE.MathUtils.clamp(state.pos.x, -LIM, LIM);
    state.pos.z = THREE.MathUtils.clamp(state.pos.z, -LIM, LIM);
    state.speedMps *= 0.4;
  }

  // --- 漂移计分 ---
  const isDrifting = Math.min(state.driftAmount, 1.15) > 0.25 && speedAbs > 6;
  if (isDrifting) {
    const gain = state.driftAmount * speedAbs * dt * 12;
    state.driftScore += gain * state.combo;
    state.comboTimer = 1.6;
    state.combo = Math.min(5, state.combo + dt * 0.35);
  } else if (state.comboTimer > 0) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) state.combo = 1;
  }

  // --- 烟雾发射 (后轮) ---
  state.smokeTimer -= dt;
  if (state.driftAmount > 0.15 && speedAbs > 5 && state.smokeTimer <= 0) {
    state.smokeTimer = 0.03;
    const intensity = state.driftAmount;
    for (const sx of [-0.92, 0.92]) {
      _tmp.copy(_right).multiplyScalar(sx).add(state.pos).addScaledVector(_fwd, -1.42);
      _tmp.y = 0.25;
      emitSmoke(_tmp, intensity);
    }
  }
  updateSmoke(dt);

  // --- 车体姿态 ---
  car.group.position.copy(state.pos);
  car.group.rotation.y = state.heading;
  // 漂移时车身视觉侧滑角(参考: slipAngle×0.42混合)
  if (state.driftAmount > 0.04 && speedAbs > 3) {
    const slipVis = THREE.MathUtils.clamp(state.lateralSpeed * 0.06, -1.19, 1.19);
    car.group.rotation.y += slipVis * state.driftAmount * 0.42;
  }
  // 车轮: 前轮转向 + 全轮滚动
  for (const w of car.wheels) {
    if (w.front) w.group.rotation.y = state.steerAngle * 1.45;
    w.group.children.forEach(m => m.rotation.x += state.speedMps * dt / 0.38);
  }

  // --- 追逐相机 (平滑跟随) ---
  const camDist = 9 + speedAbs * 0.14;
  _tmp.copy(state.pos).addScaledVector(_fwd, -camDist); _tmp.y = 4.2 + speedAbs*0.05;
  camera.position.lerp(_tmp, 1 - Math.pow(0.0012, dt));
  camera.lookAt(state.pos.x, 1.2, state.pos.z);

  // --- HUD ---
  window.__dbg = { spd: state.speedMps, drift: state.driftAmount, keys: {...keys} };
  window.__test = { state, remoteCars, myRoom, powerups, lap, boostUntil, shieldUntil, nowSec };
  hudTimer -= dt;
  if (hudTimer <= 0) {
    hudTimer = 0.08;
    document.getElementById('spd').textContent = Math.round(Math.abs(state.speedMps)*3.6);
    document.getElementById('drift').textContent = Math.min(100, Math.round(state.driftAmount*100))+'%';
    document.getElementById('score').textContent = Math.floor(state.driftScore).toLocaleString();
    document.getElementById('lapN').textContent = lap.count;
    document.getElementById('lapBest').textContent = lap.best ? lap.best.toFixed(2)+'s' : '—';
    const comboEl = document.getElementById('combo');
    if (state.combo > 1.05) {
      comboEl.style.opacity = 1;
      document.getElementById('comboX').textContent = 'x'+state.combo.toFixed(1);
    } else comboEl.style.opacity = 0;
  }

  sfxEngine(Math.abs(state.speedMps)*3.6, dt);
  sfxSkid(state.driftAmount);
  tickRemoteCars(dt);
  tickRemoteBuff(dt);
  resolveCollisions();
  updatePowerups(dt);
  updateLap();
  renderer.render(scene, camera);
}
tick();
loadLeaderboard();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('keydown', e => { if (e.code === 'KeyR') resetCar(); });
</script>
</body>
</html>
